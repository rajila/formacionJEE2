name: Sync with upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Sync fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update from upstream
        run: |
          git remote add upstream https://github.com/IvanciniGT/formacionJEE2.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
